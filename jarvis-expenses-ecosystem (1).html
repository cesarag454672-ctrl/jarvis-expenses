const express = require('express');
const axios = require('axios');
const app = express();
app.use(express.json());

const SHEETS_WEBHOOK = process.env.SHEETS_URL; // Google Apps Script URL
const WHATSAPP_TOKEN = process.env.WHATSAPP_TOKEN;

// a) Recibe mensaje texto o voz transcrita
app.post('/webhook/whatsapp', async (req,res)=>{
  const msg = req.body.entry?.[0]?.changes?.[0]?.value?.messages?.[0];
  if(!msg) return res.sendStatus(200);
  const text = msg.text?.body || msg.audio?.transcript || "";
  console.log('\uD83D\uDCE9 Mensaje:', text);

  // b) Extrae datos con regex / JSON
  // Ejemplo: "Gasté 60000 en el súper" -> {monto, categoria, descripcion}
  const montoMatch = text.match(/(\\d{3,7})/);
  const monto = montoMatch ? parseInt(montoMatch[1]) : null;
  let categoria = 'Ocio';
  if(/super|stock|supermercado/i.test(text)) categoria='Súper';
  if(/combustible|nafta|petrobras/i.test(text)) categoria='Combustible';
  if(/bolt|uber|transporte/i.test(text)) categoria='Transporte';
  if(/netflix|spotify/i.test(text)) categoria='Suscripciones';

  const payload = {
    fecha: new Date().toISOString().slice(0,10),
    categoria,
    monto,
    descripcion: text,
    metodoPago: 'Efectivo',
    origen: 'WhatsApp',
    raw: text
  };

  // c) POST a Google Sheets
  try {
    await axios.post(SHEETS_WEBHOOK, payload);
    console.log('✓ Enviado a Sheets:', payload);
  } catch(e){ console.error('Sheets error', e.message); }

  // d) Respuesta estilo JARVIS
  const reply = \`\uD83E\uDDE0 JARVIS: Registro confirmado, Sr.
\uD83D\uDCB8 \${monto?.toLocaleString('es-PY')} Gs → \${categoria}
\uD83D\uDCDD "\${text.slice(0,60)}"
\uD83D\uDCCA Total mes actualizado. ¿Desea análisis?\`;

  // Enviar via WhatsApp API
  await axios.post(\`https://graph.facebook.com/v19.0/\${process.env.PHONE_ID}/messages\`, {
    messaging_product:'whatsapp', to: msg.from,
    text:{ body: reply }
  }, { headers:{ Authorization:\`Bearer \${WHATSAPP_TOKEN}\` } });

  res.sendStatus(200);
});

app.listen(3000, ()=>console.log('Jarvis WhatsApp Agent @ :3000'));`})]}),x("div",{children:[v("p",{className:"text-[11px] font-mono opacity-50 mb-2",children:"\uD83D\uDCC1 Code.gs — Google Apps Script API REST"}),v("pre",{className:"text-[10px] font-mono bg-black/40 p-3 rounded-xl border border-white/10 overflow-auto max-h-[300px] leading-relaxed",children:`// Code.gs - Pegar en script.google.com -> Extensiones > Apps Script
const SHEET_NAME = 'Transacciones';

function doGet(e) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEET_NAME);
  const rows = sheet.getDataRange().getValues();
  const headers = rows.shift();
  const data = rows.map(r=>{
    let obj={};
    headers.forEach((h,i)=>obj[h]=r[i]);
    return obj;
  });
  return ContentService.createTextOutput(JSON.stringify(data))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEET_NAME);
    if(!sheet){
      SpreadsheetApp.getActiveSpreadsheet().insertSheet(SHEET_NAME)
        .appendRow(['id','fecha','categoria','monto','descripcion','metodoPago','origen','timestamp']);
    }
    const payload = JSON.parse(e.postData.contents);
    const id = Utilities.getUuid();
    sheet.appendRow([
      id,
      payload.fecha || new Date().toISOString().slice(0,10),
      payload.categoria || 'Ocio',
      payload.monto || 0,
      payload.descripcion || '',
      payload.metodoPago || 'Efectivo',
      payload.origen || 'Web',
      new Date().toISOString()
    ]);
    
    return ContentService.createTextOutput(JSON.stringify({ ok:true, id }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err){
    return ContentService.createTextOutput(JSON.stringify({ ok:false, error: err.message }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doOptions(){ 
  return ContentService.createTextOutput('').setMimeType(ContentService.MimeType.TEXT);
}
